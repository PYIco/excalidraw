# DigitalOcean App Platform spec for this Excalidraw fork.
# Static sites are on the free tier. Replace YOUR-GITHUB-USERNAME and the two
# Supabase values, then create the app from this spec (see SELF-HOSTING.md).
name: excalidraw
static_sites:
  - name: excalidraw
    github:
      repo: YOUR-GITHUB-USERNAME/excalidraw
      branch: master
      deploy_on_push: true
    build_command: yarn install --frozen-lockfile --network-timeout 600000 && yarn build:app:docker
    output_dir: excalidraw-app/build
    # single-page app: send unknown paths to the app
    catchall_document: index.html
    envs:
      - key: NODE_VERSION
        scope: BUILD_TIME
        value: "22"
      - key: VITE_APP_SUPABASE_URL
        scope: BUILD_TIME
        value: https://YOUR-PROJECT-REF.supabase.co
      # the "anon public" key is meant to be public; never use service_role
      - key: VITE_APP_SUPABASE_ANON_KEY
        scope: BUILD_TIME
        value: YOUR-SUPABASE-ANON-KEY
